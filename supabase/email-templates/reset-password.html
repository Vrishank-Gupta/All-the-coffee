<!-- Paste into Supabase Dashboard -> Authentication -> Email Templates -> Reset password -->
<div style="font-family: Georgia, serif; background: #fbf5ec; padding: 40px 20px;">
  <div style="max-width: 480px; margin: 0 auto; background: #fffaf2; border-radius: 24px; padding: 32px; border: 1px solid #e7d3b2;">
    <div style="width: 40px; height: 40px; background: #241711; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; text-align: center; line-height: 40px; color: #f2bd7c; font-size: 20px;">&#9749;</div>
    <h1 style="font-size: 22px; color: #241711; margin: 0 0 12px;">Reset your password</h1>
    <p style="font-size: 15px; color: #43291d; line-height: 1.6; margin: 0 0 24px;">
      Someone (hopefully you) asked to reset the password on your All The Coffee account.
    </p>
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #241711; color: #fbe9ce; text-decoration: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 14px;">
      Set a new password
    </a>
    <p style="font-size: 12px; color: #74432a; margin-top: 28px;">
      If you didn't request this, your password is still safe and you can ignore this email.
    </p>
  </div>
</div>
